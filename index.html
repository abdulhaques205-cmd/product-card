<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Card</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f4f7;
        display: flex;
        justify-content: center;
        padding: 40px;
    }

    .card {
        width: 320px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        padding: 18px;
    }

    .card img {
        width: 100%;
        border-radius: 10px;
    }

    .card h2 {
        font-size: 20px;
        margin-top: 16px;
        color: #222;
    }

    .card p {
        color: #555;
        margin: 10px 0 20px;
        line-height: 1.5;
    }

    .btn {
        padding: 10px 16px;
        background: #e7eef8;
        color: #222;
        border-radius: 8px;
        text-decoration: none;
        font-size: 14px;
        display: inline-block;
        border: 1px solid #cfd8e3;
    }

    .btn:hover {
        background: #d6e2f5;
    }
</style>
</head>

<body>

<div class="card">
    <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97" alt="Work desk image">

    <h2>Streamlining your design process today.</h2>

    <p>
        In today's fast-paced digital landscape, fostering seamless collaboration 
        among Developers and IT Operations.
    </p>

    <a href="#" class="btn">Read more →</a>
</div>

</body>
</html>
